services:
  postgres:
    image: postgres:16
    container_name: workout-postgres
    environment:
      POSTGRES_DB: workout
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - workout-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: workout-redis
    ports:
      - "6379:6379"

volumes:
  workout-pgdata:
